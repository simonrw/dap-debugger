[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dap-debugger"
version = "0.1.0"
description = "A terminal debugger for Python and Go using the Debug Adapter Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.89,<2"]

[project.scripts]
dap-debugger = "dap_debugger.__main__:main"

[dependency-groups]
dev = [
    "debugpy>=1.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
    "ty>=0.0.92",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests using real debugger processes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/dap_debugger"]
